<!DOCTYPE html>
<html lang="en">

<head>
  <title></title>
</head>

<body>

    <!-- Write your HTML content here -->
    <p id="mouse-me">Move you mouse here!</p>

<script>

    let mouseCount = 0

    // Write your script here
    let message = document.querySelector('#mouse-me')
     // add event listener when hover
    message.addEventListener('mouseover', function(){
        //increase mouse count by 1 
        mouseCount = mouseCount + 1 

        //if statement 
        if (mouseCount == 1){
            message.innerHTML = "Your mouse has been here " + mouseCount + " time"
        } else {
            message.innerHTML = "Your mouse has been here " + mouseCount + " times"
        }
        
    })
     // add event listener when the mouse is not over
    message.addEventListener('mouseout', function(){
        message.innerHTML = "Your mouse is NOT on this message"
    })

</script>

</body>
</html>
